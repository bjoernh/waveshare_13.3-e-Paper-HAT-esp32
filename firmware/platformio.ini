; PlatformIO Project Configuration for Waveshare ESP32-S3-Nano
; Custom firmware driving the Waveshare 13.3" e-Paper HAT+ (E) Spectra 6 display

[env:waveshare_esp32s3_nano]
platform = espressif32
board = arduino_nano_esp32
framework = arduino

; ESP32-S3R8 with 8 MB PSRAM, 16 MB Flash
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Development: skip deep sleep so USB stays connected and iteration is fast.
    ; Comment this out for production / battery operation.
    ;-DDEV_DISABLE_DEEP_SLEEP
    ;-DDEV_LOOP_DELAY_SECONDS=180
    ; Development: simulate the display (skip all SPI/GPIO/refresh) so the panel
    ; is not stressed during debugging sessions.  Buffer is still allocated and
    ; image data is accepted; only the hardware transfer is suppressed.
    ;-DSIM_DISPLAY

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_port = /dev/cu.usbmodem101
; Upload settings
upload_protocol = esptool
upload_speed = 921600
upload_port= /dev/cu.usbmodem101

; Libraries (WiFi and HTTP are built into ESP32 Arduino core)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
